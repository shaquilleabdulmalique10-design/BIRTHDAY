<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Birthday</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="text-6xl mb-4">🎂</div>
            <h1 class="text-2xl font-bold gold-text mb-4">Redirecting to Luxury Birthday...</h1>
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 mx-auto" style="border-color: #FFD700;"></div>
        </div>
    </div>

    <script>
        // Check if there's a magic link parameter
        const urlParams = new URLSearchParams(window.location.search);
        const magicData = urlParams.get("magic");

        if (magicData) {
            // Redirect to generator with magic link for celebration
            window.location.href = `generator.html${window.location.search}`;
        } else {
            // Redirect to home page
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1000);
        }
    </script>
</body>

</html>
